# ========================================
# Personal additions for caelestia mode
# Sourced LAST in caelestia's hyprland.conf
# ========================================

# Wallpaper directory (read recursively by caelestia shell)
env = CAELESTIA_WALLPAPERS_DIR,$HOME/pix/walls

# Enforce XDG base directories for caelestia shell
env = XDG_DATA_HOME,$HOME/.local/share
env = XDG_STATE_HOME,$HOME/.local/state
env = XDG_CACHE_HOME,$HOME/.cache
env = XDG_CONFIG_HOME,$HOME/.config

# --- Autostart: personal services ---
# (caelestia shell replaces waybar/mako/swww, so those are NOT started here)
exec-once = foot --server
exec-once = blueman-applet
exec-once = udiskie -t
exec-once = hypridle
exec-once = tailscale-systray

# --- Scratchpads ---
exec-once = [workspace special:spterm silent] footclient --app-id spterm
exec-once = [workspace special:spcalc silent] footclient --app-id spcalc -e bc -lq
exec-once = [workspace special:spncmp silent] footclient --app-id spncmpcpp -e ncmpcpp
exec-once = [workspace special:spmixer silent] footclient --app-id spmixer -e pulsemixer

# --- Personal keybinds ---
# Only binds that are NOT already in caelestia keybinds.conf or that need
# a different action than what caelestia provides.  Conflicts resolved via
# hypr-vars.conf remapping the $kb* variables.

$mainMod = SUPER
$altMod = ALT

# Scratchpad toggles
bind = $mainMod SHIFT, Return, exec, ~/.local/bin/smart-scratchpad spterm spterm "foot --app-id spterm"
bind = $mainMod, C, exec, ~/.local/bin/smart-scratchpad spcalc spcalc "foot --app-id spcalc -e bc -lq"
bind = $altMod, M, exec, ~/.local/bin/smart-scratchpad spncmpcpp spncmp "foot --app-id spncmpcpp -e ncmpcpp"
bind = $altMod, V, exec, ~/.local/bin/smart-scratchpad spmixer spmixer "foot --app-id spmixer -e pulsemixer"

# File manager via lf (Super+E is caelestia's $kbFileExplorer=thunar, this adds Shift variant)
bind = $mainMod SHIFT, E, exec, footclient -e lf
# Newsboat
bind = $mainMod, N, exec, footclient -e newsboat

# DnD toggle (Super+D freed by remapping $kbCommunication → Super+Alt+D)
bind = $mainMod, D, exec, ~/.local/bin/syspanel dnd-toggle

# Pin window (Super+S freed by remapping $kbToggleSpecialWs → Super+Alt+S)
bind = $mainMod, S, pin,

# Sysact menu
bind = $mainMod, BackSpace, exec, ~/.local/bin/sysact

# Waybar toggle (waybar not running in caelestia, but harmless)
bind = $mainMod, B, exec, pkill waybar || waybar & disown

# Bluetooth
bind = $mainMod, A, exec, blueman-manager

# Layout switching
bind = $mainMod SHIFT, T, exec, hyprctl keyword general:layout master
bind = $mainMod SHIFT, Y, exec, hyprctl keyword general:layout dwindle

# Custom scripts (Super+X freed by remapping $kbResizeWindow → Super+Alt+X)
bind = $mainMod, X, exec, ~/.local/bin/colorpick
bind = $altMod, Space, exec, ~/.local/bin/winswitcher
bind = $mainMod SHIFT, C, exec, ~/.local/bin/quickcalc
bind = $mainMod, F1, exec, ~/.local/bin/quicknote
bind = $mainMod SHIFT, F1, exec, ~/.local/bin/passgen
bind = $mainMod, F2, exec, ~/.local/bin/wifipick
bind = $mainMod SHIFT, F2, exec, ~/.local/bin/timebox-ctl
bind = $mainMod, F3, exec, ~/.local/bin/filefinder
bind = $mainMod, F5, exec, ~/.local/bin/qrhandler encode
bind = $mainMod SHIFT, F5, exec, ~/.local/bin/qrhandler decode
bind = $mainMod, F6, exec, ~/.local/bin/nightmode
bind = $mainMod, F7, exec, ~/.local/bin/ytplay play
bind = $mainMod SHIFT, F7, exec, ~/.local/bin/ytplay download
bind = $mainMod, F8, exec, ~/.local/bin/sysinfo
bind = $mainMod SHIFT, Escape, exec, ~/.local/bin/prockill
bind = $mainMod, slash, exec, ~/.local/bin/keybinds-help


# Media seek (unique — not in caelestia keybinds.conf)
bindl = $mainMod, bracketright, exec, ~/.local/bin/mediactl seek +10
bindl = $mainMod, bracketleft, exec, ~/.local/bin/mediactl seek -10
bindl = $mainMod SHIFT, bracketright, exec, ~/.local/bin/mediactl seek +60
bindl = $mainMod SHIFT, bracketleft, exec, ~/.local/bin/mediactl seek -60

# Drives
bind = $mainMod, F9, exec, ~/.local/bin/drivemount mount
bind = $mainMod, F10, exec, ~/.local/bin/drivemount unmount

# Webcam
bind = $mainMod, F11, exec, mpv --demuxer=v4l2 --demuxer-lavf-o=video_size=1280x720,input_format=mjpeg --untimed --no-cache --no-osc --no-input-default-bindings --profile=low-latency --title=webcam av://v4l2:/dev/video0

# Volume (sysnotify — caelestia uses raw wpctl, these use notification wrapper)
# Super+Minus/Equal remapped: caelestia splitratio moved since we override here
binde = $mainMod, minus, exec, ~/.local/bin/sysnotify volume_down
binde = $mainMod, equal, exec, ~/.local/bin/sysnotify volume_up
binde = $mainMod SHIFT, minus, exec, ~/.local/bin/sysnotify volume_down_big
binde = $mainMod SHIFT, equal, exec, ~/.local/bin/sysnotify volume_up_big

# Lid close/open
bindl = , switch:on:Lid Switch, exec, hyprlock & sleep 0.5 && hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# --- Personal window rules ---
# Allow transparency & blur for Foot and scratchpad terminals (overrides Caelestia opaque rule)
windowrule = opaque false, match:class ^(foot|spterm|spcalc|spncmpcpp|spmixer)$

# Scratchpad sizes
windowrule = float true, match:class ^(spterm)$
windowrule = size 1000 600, match:class ^(spterm)$
windowrule = center 1, match:class ^(spterm)$

windowrule = float true, match:class ^(spcalc)$
windowrule = size 500 400, match:class ^(spcalc)$
windowrule = center 1, match:class ^(spcalc)$

windowrule = float true, match:class ^(spncmpcpp)$
windowrule = size 1000 600, match:class ^(spncmpcpp)$
windowrule = center 1, match:class ^(spncmpcpp)$

windowrule = float true, match:class ^(spmixer)$
windowrule = size 800 500, match:class ^(spmixer)$
windowrule = center 1, match:class ^(spmixer)$

# MPV — tiled
windowrule = float false, match:class ^(mpv)$

# Brave — workspace 2
windowrule = float false, match:class ^(brave-browser)$
windowrule = workspace 2, match:class ^(brave-browser)$

# Brave extensions — floating
windowrule = float true, match:class ^(brave-browser)$, match:title ^(.*(Extension|Bitwarden|1Password|Popup).*)$
windowrule = center 1, match:class ^(brave-browser)$, match:title ^(.*(Extension|Bitwarden|1Password|Popup).*)$

# Games
windowrule = immediate true, match:class (?i)war.*thunder
windowrule = opaque true, match:class (?i)war.*thunder
windowrule = immediate true, match:class ^(cs2)$
windowrule = opaque true, match:class ^(cs2)$

# VM — workspace 5
windowrule = workspace 5, match:class ^(virt-manager|virt-viewer|remote-viewer|qemu.*|Qemu.*|.+-spice)$

# Suppress maximize
windowrule = suppress_event maximize, match:class .*

# Idle inhibit fullscreen
windowrule = idle_inhibit fullscreen, match:fullscreen 1

# Ecosystem nag
ecosystem {
    no_update_news = true
}

# agy-bridge floating terminal
windowrule = float true, match:class ^(agy-bridge)$
windowrule = size 900 550, match:class ^(agy-bridge)$
windowrule = center 1, match:class ^(agy-bridge)$

# Keyboard: Remap Caps Lock to Escape
input {
    kb_options = caps:escape
}
