# Caelestia variable overrides — use personal programs
$terminal = foot
$browser = brave
$fileExplorer = thunar
$editor = codium

# ── Keybind remaps ──
# Resolve conflicts between caelestia defaults and personal workflow.
# Personal media/scratchpad binds live in hypr-user.conf and use the keys
# that caelestia originally assigned to these actions, so we move them.

# Super+P is mediactl toggle (personal) → move pin elsewhere
$kbPinWindow = Super+Alt, P

# Super+M is fullscreen 1 (personal) → move music toggle
$kbMusic = Super+Alt, M
# Keep fullscreen on Super+M (matches personal config)
$kbWindowFullscreen = Super, M

# Super+C is scratchpad calc (personal) → move editor
$kbEditor = Super+Alt, Return

# Super+Comma / Super+Shift+Comma are mediactl prev/restart → move group
$kbToggleGroup = Ctrl+Super, Comma

# Super+D is dnd toggle (personal) → move communication
$kbCommunication = Super+Alt, D

# Super+R is mediactl repeat (personal) → move todo
# NOTE: Super+Alt+R is taken by caelestia record -s, so use Super+Alt+T
$kbTodo = Super+Alt, T

# Super+S is pin (personal) → move special workspace toggle
# NOTE: Super+Alt+S is taken by movetoworkspace special:special, so use Ctrl+Super+S
$kbToggleSpecialWs = Ctrl+Super, S

# Super+K is layout cycleprev (personal, not used in dwindle but muscle memory) → keep Show Panels
# $kbShowPanels = Super, K  # keep default — personal K isn't needed in dwindle

# Super+L is hyprlock in both → same action, no conflict
# $kbLock = Super, L  # keep default

# Super+X is colorpick (personal) → move resize
$kbResizeWindow = Super+Alt, X
