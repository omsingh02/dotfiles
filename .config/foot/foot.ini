[main]
shell=/usr/bin/zsh
initial-color-theme=dark
font=JetBrainsMonoNF-Regular:size=12
pad=15x15

[key-bindings]
font-increase=Mod1+Shift+k
font-decrease=Mod1+Shift+j
search-start=Mod1+Shift+f
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
scrollback-up-half-page=Mod1+k
scrollback-down-half-page=Mod1+j
show-urls-launch=Mod1+Shift+l

[colors-dark]
alpha=0.8
blur=yes
background=0A0F0F
foreground=DCE8E6
regular0=343434
regular1=769E00
regular2=58E2BE
regular3=82FCCC
regular4=76B6B2
regular5=7AAEE9
regular6=83D9C8
regular7=CDDCD3
bright0=9AA59E
bright1=85B900
bright2=45F7CE
bright3=CEFFE8
bright4=A4C8C2
bright5=A2C0F7
bright6=8CEDD8
bright7=FFFFFF
selection-foreground=B8EDE9
selection-background=255B57

[colors-light]
alpha=0.8
blur=yes
