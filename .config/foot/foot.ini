[main]
include=~/.cache/theme/colors-foot.ini
font=JetBrainsMonoNF-Regular:size=12, Noto Color Emoji:size=12
pad=15x15

[tweak]
# grapheme-shaping moved from [main] to [tweak] in current foot (it was silently ignored in [main])
grapheme-shaping=yes

[key-bindings]
font-increase=Mod1+Shift+k
font-decrease=Mod1+Shift+j
search-start=Mod1+Shift+f
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
scrollback-up-half-page=Mod1+k
scrollback-down-half-page=Mod1+j
show-urls-launch=Mod1+Shift+l
