# Session Environment
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Keyring
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh

# Core Services (with crash recovery — auto-restart on failure)
exec-once = ~/.local/bin/wallpaper-scripts/wall-core restore
exec-once = while true; do waybar; sleep 2; done
exec-once = while true; do mako; sleep 2; done
exec-once = while true; do hypridle; sleep 2; done
exec-once = blueman-applet
exec-once = udiskie -t
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = ~/.local/bin/wallpaper-scripts/wall-daemon
exec-once = tailscale-systray

# Clipboard Manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Terminal Daemon (with crash recovery)
exec-once = while true; do foot --server; sleep 2; done

# Scratchpads
exec-once = [workspace special:spterm silent] footclient --app-id spterm
exec-once = [workspace special:spcalc silent] footclient --app-id spcalc -e bc -lq
exec-once = [workspace special:spncmp silent] footclient --app-id spncmpcpp -e ncmpcpp
exec-once = [workspace special:spmixer silent] footclient --app-id spmixer -e pulsemixer

