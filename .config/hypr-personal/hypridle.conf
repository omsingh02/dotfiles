# ============================================
# HYPRIDLE CONFIGURATION
# ============================================
# Timeline: dim (4:30) → lock (5:00) → DPMS off (10:00) → suspend (30:00)
# Idle inhibited by: fullscreen apps (via windowrules), audio playback

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid launching multiple instances
    before_sleep_cmd = loginctl lock-session    # lock before sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # restore displays after sleep
}

# --- Stage 1: Dim screen at 4:30 (270 seconds) ---
listener {
    timeout = 270                               # 4 min 30 sec
    on-timeout = brightnessctl -s set 10%       # dim to 10%
    on-resume = brightnessctl -r                # restore brightness
}

# --- Stage 2: Lock screen at 5:00 (300 seconds) ---
listener {
    timeout = 300                               # 5 min
    on-timeout = loginctl lock-session           # triggers lock_cmd above
}

# --- Stage 3: Turn off displays at 10:00 (600 seconds) ---
listener {
    timeout = 600                               # 10 min
    on-timeout = hyprctl dispatch dpms off      # DPMS off
    on-resume = hyprctl dispatch dpms on        # DPMS on
}

# --- Stage 4: Suspend at 30:00 (1800 seconds) ---
listener {
    timeout = 1800                              # 30 min
    on-timeout = systemctl suspend-then-hibernate
}
