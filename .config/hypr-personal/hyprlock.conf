# Import wallust colors
source = $HOME/.cache/wallust/colors-hyprland.conf

# BACKGROUND
background {
    monitor =
    path = screenshot
    color = $background
    
    # High-quality frosted glass
    blur_passes = 3
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME (Uses pywal's primary accent color)
label {
    monitor =
    text = $TIME
    color = $color6
    font_size = 120
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, -250
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $color7
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    position = 0, -450
    halign = center
    valign = top
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    # Using pywal colors for the field
    outer_color = $color5
    inner_color = $background
    font_color = $foreground
    
    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}
