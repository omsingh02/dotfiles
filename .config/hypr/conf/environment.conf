# Cursor
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

# Keyring / SSH
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/keyring/ssh

# Audio — fix Chromium/Brave BT audio (forces compatible buffer size)
env = PULSE_LATENCY_MSEC,60

# Screenshots
env = HYPRSHOT_DIR,$HOME/pix/ss
# Fallback for standard installs: env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots

# Force GTK apps to prefer Wayland, fallback to X11 (needed for Wine, some Electron)
env = GDK_BACKEND,wayland,x11,*
env = GDK_SCALE,1

# Qt Wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_SCALE_FACTOR,1

# Electron apps (Brave, VSCode, Discord, etc.) native Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
