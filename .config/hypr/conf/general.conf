# General
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2

    col.active_border = $color2 $color4 45deg
    col.inactive_border = $background

    layout = master
    resize_on_border = false
    allow_tearing = true
}

# Decoration — minimal chrome, blur for transparency
decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        passes = 4
        size = 10
        new_optimizations = true
        xray = true
        noise = 0.03
        contrast = 0.9
        brightness = 0.82

        vibrancy = 0.1696
        vibrancy_darkness = 0.0
    }
}

# Animations — fast and snappy, nothing sluggish
animations {
    enabled = true

    # Bezier curves
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    # Windows — subtle popin
    animation = windows, 1, 4, easeOutQuint
    animation = windowsIn, 1, 4, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.5, linear, popin 87%

    # Fades — near-instant
    animation = fadeIn, 1, 1.7, almostLinear
    animation = fadeOut, 1, 1.5, almostLinear
    animation = fade, 1, 3, quick

    # Border color transitions
    animation = border, 1, 5, easeOutQuint

    # Layers (waybar, mako, fuzzel)
    animation = layers, 1, 3.8, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.8, almostLinear
    animation = fadeLayersOut, 1, 1.4, almostLinear

    # Workspaces — instant switch, no slide
    animation = workspaces, 0, 0, easeOutQuint

    # Special workspaces (scratchpads) — slide in/out
    animation = specialWorkspace, 1, 4, easeOutQuint, slidevert
}

# Master Layout (DWM-style)
master {
    new_status = master
    mfact = 0.55
    special_scale_factor = 0.8
}

# Misc
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    disable_splash_rendering = true
    enable_swallow = true
    swallow_regex = ^(foot)$
    enable_anr_dialog = true
    anr_missed_pings = 10
    allow_session_lock_restore = true
    middle_click_paste = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# Cursor
cursor {
    inactive_timeout = 3
    hide_on_key_press = true
}

# Render
render {
    direct_scanout = 0
}

# Binds
binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
    hide_special_on_workspace_change = true
}

# XWayland
xwayland {
    force_zero_scaling = true
}

# Ecosystem
ecosystem {
    no_update_news = true
}
