# Input
input {
    kb_layout = us
    kb_options = caps:escape
    follow_mouse = 1
    sensitivity = 0.2
    repeat_delay = 300
    repeat_rate = 50
    numlock_by_default = true
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# Gestures (new v0.54 syntax — gesture = fingers, direction, action)
gesture = 3, horizontal, workspace

# Gesture tuning (still under gestures {} section)
gestures {
    workspace_swipe_distance = 250
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = false
}
