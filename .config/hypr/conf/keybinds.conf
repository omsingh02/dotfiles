$mainMod = SUPER
$altMod = ALT

# Core Apps
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, $browser
#bind = $mainMod SHIFT, W, exec, $browser --incognito
bind = $mainMod, E, exec, footclient -e lf
bind = $mainMod, N, exec, footclient -e newsboat
bind = $mainMod, grave, exec, bemoji -t

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, F, togglefloating,
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, BackSpace, exec, ~/.local/bin/sysact
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Space, layoutmsg, swapwithmaster
bind = $mainMod, S, pin,
bind = $mainMod, B, exec, pkill waybar || waybar & disown
# Notification Panel (syspanel)
bind = $mainMod, D, exec, ~/.local/bin/syspanel show
bind = $mainMod SHIFT, D, exec, ~/.local/bin/syspanel clear
bind = $mainMod CTRL, D, exec, ~/.local/bin/syspanel dnd-toggle

# Alt-Tab — cycle focus (Windows-like)
bind = $altMod, Tab, cyclenext,
bind = $altMod, Tab, bringactivetotop,

# Layout Switching
bind = $mainMod, T, exec, hyprctl keyword general:layout master
bind = $mainMod, Y, exec, hyprctl keyword general:layout dwindle

# Master Layout Controls
bind = $mainMod, J, layoutmsg, cyclenext
bind = $mainMod, K, layoutmsg, cycleprev
bind = $mainMod, I, layoutmsg, addmaster
bind = $mainMod, O, layoutmsg, removemaster
bind = $mainMod CTRL, M, layoutmsg, focusmaster
bind = $mainMod, Tab, layoutmsg, orientationcycle left top

# Resize Submap (Super+Ctrl+R to enter, Escape/Return to exit)
bind = $mainMod CTRL, R, submap, resize
submap = resize
binde = , H, resizeactive, -40 0
binde = , L, resizeactive, 40 0
binde = , K, resizeactive, 0 -40
binde = , J, resizeactive, 0 40
binde = , left, resizeactive, -40 0
binde = , right, resizeactive, 40 0
binde = , up, resizeactive, 0 -40
binde = , down, resizeactive, 0 40
bind = , Escape, submap, reset
bind = , Return, submap, reset
submap = reset

# Bluetooth Manager
bind = $mainMod, A, exec, blueman-manager

# Scratchpad Toggles
bind = $mainMod SHIFT, Return, exec, ~/.local/bin/smart-scratchpad spterm spterm "foot --app-id spterm"
bind = $mainMod, C, exec, ~/.local/bin/smart-scratchpad spcalc spcalc "foot --app-id spcalc -e bc -lq"
bind = $altMod, M, exec, ~/.local/bin/smart-scratchpad spncmpcpp spncmp "foot --app-id spncmpcpp -e ncmpcpp"
bind = $mainMod, V, exec, ~/.local/bin/smart-scratchpad spmixer spmixer "foot --app-id spmixer -e pulsemixer"
# bind = $altMod, S, exec, ~/.local/bin/smart-scratchpad brave-open.spotify.com__-Default spspotify "brave --app='https://open.spotify.com/'"
# bind = $altMod, W, exec, ~/.local/bin/smart-scratchpad brave-web.whatsapp.com__-Default spwhatsapp "brave --app='https://web.whatsapp.com/'"
bind = $altMod, S, exec, ~/.local/bin/toggle-webapp spspotify "brave --app='https://open.spotify.com/'"
bind = $altMod, W, exec, ~/.local/bin/toggle-webapp spwhatsapp "brave --profile-directory='Default' --app='https://web.whatsapp.com/'"
bind = $altMod, R, exec, ~/.local/bin/wa-reel-menu
bind = $mainMod SHIFT, R, exec, ~/.local/bin/wa-reel-menu

# Move focused window to scratchpad
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:spterm

# Launcher, Clipboard, Wallpaper
bindr = $mainMod, SUPER_L, exec, pkill fuzzel || $menu
bind = $mainMod SHIFT, W, exec, pkill fuzzel || ~/.local/bin/wallpaper-pick
bind = $mainMod ALT, C, exec, cliphist list | fuzzel -d | cliphist delete
bind = $altMod, C, exec, cliphist list | fuzzel -d | cliphist decode | wl-copy

# Screenshots (saved to ~/pix/ss/ AND copied to clipboard)
bind = , Print, exec, ~/.local/bin/screenshot full
bind = SHIFT, Print, exec, ~/.local/bin/screenshot region
bind = $altMod, Print, exec, ~/.local/bin/screenshot ocr

# Screen Recording (gpu-screen-recorder)
bind = $mainMod, Print, exec, ~/.local/bin/screenrecord toggle
bind = $mainMod SHIFT, Print, exec, ~/.local/bin/screenrecord region
bind = $mainMod, Delete, exec, ~/.local/bin/screenrecord stop
bind = $mainMod, Pause, exec, ~/.local/bin/screenrecord pause

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Adjacent workspace cycling (shiftview)
bind = $mainMod, G, workspace, m-1
bind = $mainMod, semicolon, workspace, m+1
bind = $mainMod SHIFT, G, movetoworkspace, m-1
bind = $mainMod SHIFT, semicolon, movetoworkspace, m+1

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume (keyboard — sysnotify)
binde = $mainMod, minus, exec, ~/.local/bin/sysnotify volume_down
binde = $mainMod, equal, exec, ~/.local/bin/sysnotify volume_up
binde = $mainMod SHIFT, minus, exec, ~/.local/bin/sysnotify volume_down_big
binde = $mainMod SHIFT, equal, exec, ~/.local/bin/sysnotify volume_up_big
bind = $mainMod SHIFT, M, exec, ~/.local/bin/sysnotify volume_mute

# Volume (XF86 keys — sysnotify)
bindel = ,XF86AudioRaiseVolume, exec, ~/.local/bin/sysnotify volume_up
bindel = ,XF86AudioLowerVolume, exec, ~/.local/bin/sysnotify volume_down
bindel = ,XF86AudioMute, exec, ~/.local/bin/sysnotify volume_mute
bindel = ,XF86AudioMicMute, exec, ~/.local/bin/sysnotify mic_mute

# Brightness (via sysnotify)
bindel = ,XF86MonBrightnessUp, exec, ~/.local/bin/sysnotify brightness_up
bindel = ,XF86MonBrightnessDown, exec, ~/.local/bin/sysnotify brightness_down

# Media (mpc with playerctl fallback + notifications)
bindl = , XF86AudioNext, exec, ~/.local/bin/mediactl next
bindl = , XF86AudioPause, exec, ~/.local/bin/mediactl toggle
bindl = , XF86AudioPlay, exec, ~/.local/bin/mediactl toggle
bindl = , XF86AudioPrev, exec, ~/.local/bin/mediactl prev
bindl = $mainMod, bracketright, exec, ~/.local/bin/mediactl seek +10
bindl = $mainMod, bracketleft, exec, ~/.local/bin/mediactl seek -10
bindl = $mainMod SHIFT, bracketright, exec, ~/.local/bin/mediactl seek +60
bindl = $mainMod SHIFT, bracketleft, exec, ~/.local/bin/mediactl seek -60
bindl = $mainMod, R, exec, ~/.local/bin/mediactl repeat

# Media (letter keybinds — no media keys on this laptop)
bind = $mainMod, P, exec, ~/.local/bin/mediactl toggle
bind = $mainMod, period, exec, ~/.local/bin/mediactl next
bind = $mainMod, comma, exec, ~/.local/bin/mediactl prev
bind = $mainMod SHIFT, P, exec, ~/.local/bin/mediactl stop
bind = $mainMod SHIFT, comma, exec, ~/.local/bin/mediactl restart

# Drives
bind = $mainMod, F9, exec, ~/.local/bin/drivemount mount
bind = $mainMod, F10, exec, ~/.local/bin/drivemount unmount

# Webcam (MJPG 720p @ 30fps, un-mirrored)
bind = $mainMod, F11, exec, mpv av://v4l2:/dev/video0 --demuxer-lavf-o=video_size=1280x720,input_format=mjpeg --profile=low-latency --untimed --no-cache --no-osc --title=webcam --vf=hflip

# ----------------------------------------------------
# Utilities / Scripts (Added by AI)
# ----------------------------------------------------
bind = $mainMod, X, exec, ~/.local/bin/colorpick
bind = $altMod, Space, exec, ~/.local/bin/winswitcher
bind = $mainMod SHIFT, C, exec, ~/.local/bin/quickcalc
bind = $mainMod, F1, exec, ~/.local/bin/quicknote
bind = $mainMod SHIFT, F1, exec, ~/.local/bin/passgen
bind = $mainMod, F2, exec, ~/.local/bin/wifipick
bind = $mainMod SHIFT, F2, exec, ~/.local/bin/timebox-ctl
bind = $mainMod, F3, exec, ~/.local/bin/filefinder
bind = $mainMod, F4, exec, ~/.local/bin/hotspot
bind = $mainMod, F6, exec, ~/.local/bin/nightmode
bind = $mainMod, F7, exec, ~/.local/bin/ytplay play
bind = $mainMod SHIFT, F7, exec, ~/.local/bin/ytplay download
bind = $mainMod, F8, exec, ~/.local/bin/sysinfo
bind = $mainMod SHIFT, Escape, exec, ~/.local/bin/prockill
bind = $mainMod, slash, exec, ~/.local/bin/keybinds-help

# QR Codes
bind = $mainMod, F5, exec, ~/.local/bin/qrhandler encode

bind = $mainMod SHIFT, F5, exec, ~/.local/bin/qrhandler decode


# Lid close/open handling
bindl = , switch:on:Lid Switch, exec, hyprlock & sleep 0.5 && hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# Sleep: Use pure suspend
bind = Super+Shift, L, exec, systemctl suspend
