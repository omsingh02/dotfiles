# ==========================================
# HYPRLAND 0.53+ WINDOW RULES
# ==========================================

# Suppress maximize requests from all apps
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = hotspot-qr-float
    match:title = ^Hotspot QR$
    float = true
    size = 400 400
    center = true
}

windowrule {
  name = war-thunder-optimizations
  match:class = (?i)war.*thunder

  immediate = on
  no_anim = on
  opaque = on
}

windowrule {
  name = cs2-optimizations
  match:class = ^(cs2)$

  immediate = on
  no_anim = on
  opaque = on
}

layerrule {
    name = waybar-glass
    match:namespace = waybar

    blur = on
    xray = true           # Makes the bar blur through windows behind it
    ignore_alpha = 0.5     # Keeps icons and text sharp
    no_anim = off         # Keeps the bar animation if it slides in
}
# Fix XWayland drag issues
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:float = 1
    match:fullscreen = 0
    match:pin = 0
    no_focus = 1
}

# Prevent lock/sleep during fullscreen video
windowrule {
    name = idle-inhibit-fullscreen
    match:fullscreen = 1
    idle_inhibit = fullscreen
}

# MPV — tiled, opaque
windowrule {
    name = mpv-rules
    match:class = ^(mpv)$
    float = 0
    opaque = true
}

# Brave — tiled, workspace 2
windowrule {
    name = brave-rules
    match:class = ^(brave-browser)$
    float = 0
    workspace = 2
}

# Brave Extensions — floating
windowrule {
    name = brave-extensions
    match:class = ^(brave-browser)$
    match:title = ^(.*(Extension|Bitwarden|1Password|Popup).*)$
    float = 1
    center = 1
}

# Foot — tiled, workspace 1
windowrule {
    name = foot-rules
    match:class = ^(foot)$
    float = 0
    workspace = 1
    opacity = 0.85 0.75
}

# Scratchpad: terminal
windowrule {
    name = spterm-rules
    match:class = ^(spterm)$
    float = 1
    size = 1000 600
    center = 1
    opacity = 0.85 0.75
}

# Scratchpad: calculator
windowrule {
    name = spcalc-rules
    match:class = ^(spcalc)$
    float = 1
    size = 500 400
    center = 1
}

# Scratchpad: ncmpcpp
windowrule {
    name = spncmpcpp-rules
    match:class = ^(spncmpcpp)$
    float = 1
    size = 1000 600
    center = 1
}

# Scratchpad: pulsemixer
windowrule {
    name = spmixer-rules
    match:class = ^(spmixer)$
    float = 1
    size = 800 500
    center = 1
}

# Scratchpad: spotify
windowrule {
    name = spspotify-rules
    match:title = (?i).*Spotify.*
    float = 1
    size = 1000 600
    center = 1
    workspace = special:spspotify
}

# Scratchpad: whatsapp
windowrule {
    name = spwhatsapp-rules
    match:class = ^(brave-web\.whatsapp\.com.*)$
    float = 1
    size = 1000 600
    center = 1
    workspace = special:spwhatsapp
}

windowrule {
    name = spwhatsapp-title-rules
    match:title = (?i).*WhatsApp.*
    float = 1
    size = 1000 600
    center = 1
    workspace = special:spwhatsapp
}

# Antigravity — workspace 3
windowrule {
    name = antigravity-rules
    match:class = ^(antigravity)$
    workspace = 3
}

# VSCode — workspace 3
windowrule {
    name = vscode-rules
    match:class = ^(Code|code-url-handler|code)$
    workspace = 3
    opacity = 0.85 0.75
}

# Virt-Manager — workspace 5
windowrule {
    name = virt-manager-rules
    match:class = ^(virt-manager)$
    workspace = 5
}

# Virtual Machines — workspace 5
windowrule {
    name = vm-rules
    match:class = ^(virt-viewer|remote-viewer|qemu.*|Qemu.*|.+-spice)$
    workspace = 5
}

# WhatsApp Reel Player (mpv floating on right side, 25px from edge)
windowrule = float 1, match:class ^(wa-reel)$
windowrule = size 420 750, match:class ^(wa-reel)$
windowrule = pin 1, match:class ^(wa-reel)$
windowrule = move 72% 15%, match:class ^(wa-reel)$

windowrule = float 1, match:title ^(wa-reel)$
windowrule = size 420 750, match:title ^(wa-reel)$
windowrule = pin 1, match:title ^(wa-reel)$
windowrule = move 72% 15%, match:title ^(wa-reel)$

# WhatsApp Reels Digest (centered floating window matching spterm/spncmpcpp)
windowrule {
    name = wa-reel-digest-rules
    match:class = ^(wa-reel-digest)$
    float = 1
    size = 1000 600
    center = 1
    opacity = 0.85 0.75
}

windowrule = float 1, match:class ^(wa-reel-digest)$
windowrule = size 1000 600, match:class ^(wa-reel-digest)$
windowrule = center 1, match:class ^(wa-reel-digest)$

# agy-bridge floating terminal
windowrule {
    name = agy-bridge-floating
    match:class = ^(agy-bridge)$
    float = true
    size = 900 550
    center = true
}
