# Fullscreen windows (the idle-inhibit-fullscreen rule) and audio playback inhibit all of this.

general {
    lock_cmd = pidof hyprlock || hyprlock       # never a second hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = (hyprctl monitors -j | grep -q '"dpmsStatus": false' && hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' || true) && brightnessctl -r   # wake the screen only if it is off
    inhibit_sleep = 3                           # hyprlock must be on screen before the machine sleeps
}

listener {
    timeout = 270
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl monitors -j | grep -q '"dpmsStatus": false' && hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' || true
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
