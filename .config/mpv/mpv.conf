# mpv Configuration File
# Modern, high-quality, Pywal-friendly defaults

# --- Video & Hardware Decoding ---
vo=gpu-next
hwdec=auto-safe
profile=high-quality

# --- Window & UI ---
keep-open=yes              # Keep mpv open after video finishes
save-position-on-quit=yes  # Remember where we left off
autofit-larger=90%x90%     # Don't let the window be larger than the screen
geometry=50%:50%           # Start centered

# --- OSD (On Screen Display) ---
osd-font='Inter'           # Modern sans font
osd-font-size=40
osd-color='#FFFFFF'        # Crisp white text
osd-border-color='#000000' # Black border for readability
osd-shadow-color='#000000'
osd-shadow-offset=2

# --- Subtitles ---
sub-auto=fuzzy             # Load external subs with similar names
sub-font='Inter'
sub-font-size=44
sub-color='#FFFFFFFF'
sub-border-color='#FF000000'
sub-shadow-offset=2

# --- Audio ---
volume=100
volume-max=150             # Allow boost if video is quiet
alang=eng,en,enUS,en-US
slang=eng,en,enUS,en-US

# --- Screenshots ---
screenshot-format=png
screenshot-png-compression=8
screenshot-template='~/pix/mpv-shot-%F-%p-%n'
