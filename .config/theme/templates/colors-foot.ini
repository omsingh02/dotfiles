regular1={{dark.color1|strip}}
regular2={{dark.color2|strip}}
regular3={{dark.color3|strip}}
regular4={{dark.color4|strip}}
regular5={{dark.color5|strip}}
regular6={{dark.color6|strip}}
regular7={{dark.color7|strip}}
bright0={{dark.color8|strip}}
