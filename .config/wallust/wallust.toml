# wallust v3.4
#
# You can copy this file to ~/.config/wallust/wallust.toml (keep in mind is a sample config)

# SIMPLE TUTORIAL, or `man wallust.5`:
# https://explosion-mental.codeberg.page/wallust/
#
# If comming from v2: https://explosion-mental.codeberg.page/wallust/v3.html#wallusttoml

# Global section - values below can be overwritten by command line flags

# How the image is parse, in order to get the colors:
# full - resized - wal - thumb -  fastresize - kmeans
backend = "fastresize"

# What color space to use to produce and select the most prominent colors:
# lab - labmixed - lch - lchmixed
color_space = "lab"

# Use the most prominent colors in a way that makes sense, a scheme color palette:
# dark - dark16 - darkcomp - darkcomp16
# light - light16 - lightcomp - lightcomp16
# harddark - harddark16 - harddarkcomp - harddarkcomp16
# softdark - softdark16 - softdarkcomp - softdarkcomp16
# softlight - softlight16 - softlightcomp - softlightcomp16
palette = "dark16"

# Ensures a "readable contrast" (OPTIONAL, disabled by default)
# Should only be enabled when you notice an unreadable contrast frequently happening
# with your images. The reference color for the contrast is the background color.
check_contrast = true

# Color saturation, between [1% and 100%] (OPTIONAL, disabled by default)
# usually something higher than 50 increases the saturation and below
# decreases it (on a scheme with strong and vivid colors)
saturation = 45

# Alpha value for templating, by default 100 (no other use whatsoever)
#alpha = 100

[templates]
# Hyprland color variables (sourced by hyprland.conf and hyprlock.conf)
hyprland = { template = 'colors-hyprland.conf', target = '~/.cache/wallust/colors-hyprland.conf' }

# Waybar CSS color definitions
waybar = { template = 'colors-waybar.css', target = '~/.cache/wallust/colors-waybar.css' }

# Mako notification colors (appended to config.base)
mako = { template = 'colors-mako', target = '~/.cache/wallust/colors-mako' }

# Foot terminal colors (appended to foot.ini.base)
foot = { template = 'colors-foot.ini', target = '~/.cache/wallust/colors-foot.ini' }

# Fuzzel launcher colors
fuzzel = { template = 'colors-fuzzel.ini', target = '~/.cache/wallust/colors-fuzzel.ini' }

# Btop color theme
btop = { template = 'colors-btop.theme', target = '~/.config/btop/themes/wallust.theme' }

# GTK 3/4 color definitions (wall-swww copies to both gtk-3.0 and gtk-4.0)
gtk = { template = 'colors-gtk.css', target = '~/.cache/wallust/colors-gtk.css' }

# Qt5/Qt6 color scheme (wall-swww copies to both qt5ct and qt6ct)
qt = { template = 'colors-qt.colors', target = '~/.cache/wallust/colors-qt.colors' }

# Neovim colorscheme
nvim = { template = 'colors-nvim.lua', target = '~/.cache/wallust/colors-nvim.lua' }

# Zathura PDF reader colors
zathura = { template = 'colors-zathura', target = '~/.cache/wallust/colors-zathura' }

# VS Code / Antigravity IDE Wallust Theme
vscode = { template = 'colors', target = '~/.cache/wallust/colors' }
vscode_json = { template = 'colors.json', target = '~/.cache/wallust/colors.json' }

# Starship prompt configuration
starship = { template = 'starship.toml', target = '~/.config/starship.toml' }
